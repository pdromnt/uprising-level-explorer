name: Build release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag (for example v0.1.0 or 0.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve existing version tag to an immutable commit
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?(-[0-9A-Za-z.-]+)?$ ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          source_ref=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      package_version: ${{ inputs.release_tag }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: runtime-*
          path: release-assets
          merge-multiple: true
      - name: Verify tag, package checksums and source commits
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_REF" ]
          cd release-assets
          [ "$(cat source-windows-x64.txt)" = "$SOURCE_REF" ]
          [ "$(cat source-macos-arm64.txt)" = "$SOURCE_REF" ]
          checksums=(*.sha256)
          [ "${#checksums[@]}" -eq 2 ]
          sha256sum -c "${checksums[@]}"
          cat "${checksums[@]}" > SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          assets=(release-assets/*.exe release-assets/*.dmg release-assets/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes
          fi
